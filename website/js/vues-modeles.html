<!--
  Menus déroulants des pages « Résultats » et « Publications DEPP ».

  Trois familles de vues, rendues en entier au rendu ; seule la vue portant
  `.vue-active` est visible (CSS dans `style/styles.scss`). Ce script déplace
  cette classe au gré des menus, sans rechargement.

  1. Vues « un modèle » de la page Résultats (`.vue-modele[data-vue-modele]`) :
     la clé se compose à partir des menus `.selecteur-config` —
       `annees|<modèle>|<prompt>`                       (années comparées)
       `prompts|<modèle>|<année>|<prompt A>|<prompt B>` (prompts comparés)
     identique à `Vue.cle` dans `_analyse.py`. Une combinaison sans vue affiche
     `.vue-modele-absente`.
  2. Vues « un modèle » simples (page Publications DEPP) : menu
     `select.selecteur-modele`, la clé est le nom du modèle.
  3. Vues « paire de modèles » (`.vue-paire[data-vue-paire]`) : clé
     `<année>|<prompt>|<modèle A>|<modèle B>` (`_analyse.cle_paire`), modèles
     dans l'ordre de la page. Deux fois le même modèle affiche
     `.vue-paire-identique` ; une paire non exportée, `.vue-paire-absente`.

  Sans JavaScript, les vues actives posées au rendu restent affichées : la page
  garde du sens, avec la configuration de référence.

  Le choix est mémorisé dans `localStorage` et reflété dans l'URL, pour qu'un
  lien pointe sur une vue précise.
-->
<script>
(function () {
  "use strict";

  var CLE_CONFIG = "resultats.vue";
  var CLE_MODELE = "resultats.modele";
  var CLE_PAIRE = "resultats.paire-config";

  function lireMemoire(cle) {
    try { return window.localStorage.getItem(cle); } catch (e) { return null; }
  }

  function ecrireMemoire(cle, valeur) {
    try { window.localStorage.setItem(cle, valeur); } catch (e) { /* navigation privée */ }
  }

  function parametre(nom) {
    return new URLSearchParams(window.location.search).get(nom);
  }

  /** Reflète la sélection dans l'URL, sans ajouter d'entrée d'historique. */
  function majUrl(parametres) {
    try {
      var url = new URL(window.location.href);
      Object.keys(parametres).forEach(function (cle) {
        url.searchParams.set(cle, parametres[cle]);
      });
      window.history.replaceState(null, "", url);
    } catch (e) {
      // Page ouverte depuis le disque (file://) : l'URL n'est pas modifiable.
    }
  }

  /**
   * Publie la hauteur de la barre de navigation, dont le menu collant se décale.
   * Le thème Quarto la fixe en haut de la fenêtre : sans ce décalage, le menu
   * passerait dessous.
   */
  function majHauteurEntete() {
    var entete = document.getElementById("quarto-header");
    var hauteur = entete ? entete.offsetHeight : 0;
    document.documentElement.style.setProperty("--hauteur-entete", hauteur + "px");
  }

  function tous(selecteur) {
    return Array.prototype.slice.call(document.querySelectorAll(selecteur));
  }

  /** Active la vue dont l'attribut vaut `valeur` ; renvoie vrai si elle existe. */
  function activer(vues, attribut, valeur) {
    var trouvee = false;
    vues.forEach(function (vue) {
      var actif = valeur !== null && vue.getAttribute(attribut) === valeur;
      vue.classList.toggle("vue-active", actif);
      trouvee = trouvee || actif;
    });
    return trouvee;
  }

  /** Sélectionne `valeur` dans un menu si elle y figure ; renvoie vrai sinon faux. */
  function choisirOption(menu, valeur) {
    if (!menu || valeur === null || valeur === undefined) { return false; }
    var existe = Array.prototype.some.call(menu.options, function (o) { return o.value === valeur; });
    if (existe) { menu.value = valeur; }
    return existe;
  }

  // ── 1. Vues « un modèle » composées (page Résultats) ──────────────────────
  function initialiserConfig() {
    var conteneur = document.querySelector(".selecteur-config");
    if (!conteneur) { return; }
    var q = function (classe) { return conteneur.querySelector("select." + classe); };
    var menuMode = q("sel-mode");
    var menuModele = q("sel-modele");
    var menuPrompt = q("sel-prompt");
    var menuAnnee = q("sel-annee");
    var menuPromptA = q("sel-prompt-a");
    var menuPromptB = q("sel-prompt-b");
    var groupes = Array.prototype.slice.call(conteneur.querySelectorAll(".sel-groupe"));
    var ordrePrompts = (conteneur.getAttribute("data-prompts") || "").split("|");
    var vues = tous(".vue-modele[data-vue-modele]");
    var absente = document.querySelector(".vue-modele-absente");

    /** Clé de la vue désignée par les menus (prompts A/B dans l'ordre de la page). */
    function cleCourante() {
      var modele = menuModele.value;
      if (menuMode.value === "annees") {
        return "annees|" + modele + "|" + menuPrompt.value;
      }
      var a = menuPromptA.value;
      var b = menuPromptB.value;
      if (a === b) { return null; }
      if (ordrePrompts.indexOf(a) > ordrePrompts.indexOf(b)) { var t = a; a = b; b = t; }
      return "prompts|" + modele + "|" + menuAnnee.value + "|" + a + "|" + b;
    }

    function appliquer(memoriser) {
      groupes.forEach(function (g) { g.hidden = g.getAttribute("data-mode") !== menuMode.value; });
      var cle = cleCourante();
      var trouvee = activer(vues, "data-vue-modele", cle);
      if (absente) { absente.classList.toggle("vue-active", !trouvee); }
      if (memoriser && cle) {
        ecrireMemoire(CLE_CONFIG, cle);
        majUrl({ vue: cle });
      }
    }

    /** Positionne les menus d'après une clé de vue (URL ou mémoire). */
    function restaurer(cle) {
      var morceaux = (cle || "").split("|");
      if (morceaux[0] === "annees" && morceaux.length === 3) {
        return choisirOption(menuMode, "annees") && choisirOption(menuModele, morceaux[1])
          && choisirOption(menuPrompt, morceaux[2]);
      }
      if (morceaux[0] === "prompts" && morceaux.length === 5) {
        return choisirOption(menuMode, "prompts") && choisirOption(menuModele, morceaux[1])
          && choisirOption(menuAnnee, morceaux[2]) && choisirOption(menuPromptA, morceaux[3])
          && choisirOption(menuPromptB, morceaux[4]);
      }
      return false;
    }

    [menuMode, menuModele, menuPrompt, menuAnnee, menuPromptA, menuPromptB].forEach(function (menu) {
      if (menu) { menu.addEventListener("change", function () { appliquer(true); }); }
    });

    var initial = parametre("vue") || lireMemoire(CLE_CONFIG);
    if (initial && restaurer(initial)) { appliquer(false); }
  }

  // ── 2. Vues « un modèle » simples (page Publications DEPP) ────────────────
  function initialiserModele() {
    var menus = tous("select.selecteur-modele");
    var vues = tous(".vue-modele[data-vue-modele]");
    if (!menus.length) { return; }

    function choisirModele(valeur, memoriser) {
      if (!activer(vues, "data-vue-modele", valeur)) { return; }
      menus.forEach(function (menu) { menu.value = valeur; });
      if (memoriser) {
        ecrireMemoire(CLE_MODELE, valeur);
        majUrl({ modele: valeur });
      }
    }

    menus.forEach(function (menu) {
      menu.addEventListener("change", function () { choisirModele(menu.value, true); });
    });
    var initial = parametre("modele") || lireMemoire(CLE_MODELE);
    if (initial) { choisirModele(initial, false); }
  }

  // ── 3. Vues « paire de modèles » ───────────────────────────────────────────
  function initialiserPaires() {
    var menuConfig = document.querySelector("select.selecteur-paire-config");
    var menuA = document.querySelector("select.selecteur-paire[data-role='a']");
    var menuB = document.querySelector("select.selecteur-paire[data-role='b']");
    if (!menuA || !menuB) { return; }
    var conteneur = menuA.closest(".selecteur-vue");
    var ordre = conteneur ? (conteneur.getAttribute("data-modeles") || "").split("|") : [];
    var paires = tous(".vue-paire[data-vue-paire]");
    var identiques = document.querySelector(".vue-paire-identique");
    var absente = document.querySelector(".vue-paire-absente");

    /** Clé d'une paire, modèles normalisés dans l'ordre de la page. */
    function cle(config, a, b) {
      var modeles = ordre.indexOf(a) <= ordre.indexOf(b) ? a + "|" + b : b + "|" + a;
      return config + "|" + modeles;
    }

    function choisirPaire(memoriser) {
      var config = menuConfig ? menuConfig.value : "";
      var a = menuA.value;
      var b = menuB.value;
      var meme = a === b;
      var trouvee = activer(paires, "data-vue-paire", meme ? null : cle(config, a, b));
      if (identiques) { identiques.classList.toggle("vue-active", meme); }
      if (absente) { absente.classList.toggle("vue-active", !meme && !trouvee); }
      if (memoriser) {
        ecrireMemoire(CLE_PAIRE, config + "|" + a + "|" + b);
        majUrl({ paire: config + "|" + a + "|" + b });
      }
    }

    [menuConfig, menuA, menuB].forEach(function (menu) {
      if (menu) { menu.addEventListener("change", function () { choisirPaire(true); }); }
    });
    var memoire = (parametre("paire") || lireMemoire(CLE_PAIRE) || "").split("|");
    if (memoire.length === 4
        && (!menuConfig || choisirOption(menuConfig, memoire[0] + "|" + memoire[1]))
        && choisirOption(menuA, memoire[2]) && choisirOption(menuB, memoire[3])) {
      choisirPaire(false);
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    majHauteurEntete();
    window.addEventListener("resize", majHauteurEntete);
    initialiserConfig();
    initialiserModele();
    initialiserPaires();
  });
})();
</script>
