# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée 2021 — MÉTHODE C (end-to-end) — prompt « doute »
# ═══════════════════════════════════════════════════════════════════════════
#  Identique à dictee2021_end2end_petitsmots.yaml, plus le signal de doute :
#    report_doubt : champ « lecture_alternative » par item, AVANT le code, rempli
#                   SEULEMENT en cas d'hésitation réelle entre deux lectures des
#                   traits ("" sinon). Hésitation de forme sur s/r, n/m, n/u,
#                   e/l, a/o avec le mot attendu parmi les deux lectures : code 1.
#  Le champ est enregistré dans le JSONL (colonne `lecture_alternative`) pour
#  mesurer s'il repère les désaccords avec l'expert (AUC, courbe de renvoi).
#  End-to-end seulement : l'étape 2 du two_stage ne voit pas l'image. Décision D15.
#
#  À vérifier en premier : la part d'items avec une alternative non vide. Quelques
#  % au plus ; au-delà, le modèle surinterprète et le signal ne vaut rien.
#
#  Test sur échantillon (export vers predictions/experimentations/, cf. D9) :
#    launchers/launch_eval.sh --config configs/scoring/dictee2021_end2end_doute.yaml --limit 300 --no-export
#  Corpus complet :
#    launchers/launch_eval.sh --config configs/scoring/dictee2021_end2end_doute.yaml --prompt doute
# ═══════════════════════════════════════════════════════════════════════════

name: dictee2021_end2end_doute
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe #ou gemma4-26b-moe
  kind: vlm
  temperature: 0.0
  max_tokens: 8192
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

# Pas de bloc model_stage2 en end_to_end (une seule passe).

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2021/
  # Format LONG (dictee;num_item;corrige), reconnu par data/loaders.load_labels.
  labels_path: s3://projet-production-ecrits-depp/correction_dictee_2021.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  case_rules: true
  lenient_punctuation: true
  doubt_word_is_error: true
  small_words_rules: true
  report_doubt: true
