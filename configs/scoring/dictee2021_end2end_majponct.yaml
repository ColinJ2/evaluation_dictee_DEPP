# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée 2021 — MÉTHODE C (end-to-end) — prompt « majponct »
# ═══════════════════════════════════════════════════════════════════════════
#  Identique à dictee2021_end2end.yaml (prompt `base`), plus trois consignes :
#    case_rules          : la majuscule fait partie de l'orthographe (manquante ou
#                          en trop = 9 ; accent facultatif sur une majuscule).
#    lenient_punctuation : ponctuation au bénéfice du doute — un signe visible vaut
#                          1, sauf s'il est sûrement un autre signe (9) ; l'absence
#                          (0) seulement si elle est sûre.
#    doubt_word_is_error : hors ponctuation, un doute entre correct et erreur
#                          se code 9.
#  Une seule passe : les trois règles portent sur le codage.
#
#  Nom : dictee<année>_<approche>_<prompt> (convention de `run_names.py`).
#  Comparer à `base` sur le site : page Résultats, mode « deux prompts », 2021.
#
#  Lancer : launchers/launch_eval.sh --config configs/scoring/dictee2021_end2end_majponct.yaml --prompt majponct
#  Sortie  : data/processed/dictee2021_end2end_majponct_<modele>_predictions.jsonl
# ═══════════════════════════════════════════════════════════════════════════

name: dictee2021_end2end_majponct
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe #ou gemma4-26b-moe
  kind: vlm
  temperature: 0.0
  max_tokens: 8192
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

# Pas de bloc model_stage2 en end_to_end (une seule passe).

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2021/
  # Format LONG (dictee;num_item;corrige), reconnu par data/loaders.load_labels.
  labels_path: s3://projet-production-ecrits-depp/correction_dictee_2021.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  case_rules: true
  lenient_punctuation: true
  doubt_word_is_error: true
